# SonarQube Project Configuration for LiveEuy Mobile (Flutter)
sonar.projectKey=LiveEuy_Mobile
sonar.projectName=LiveEuy Mobile (Flutter)
sonar.projectVersion=1.0.0

# Paths to sources and tests
sonar.sources=lib
sonar.tests=test

# File Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (Generated files, native platform folders)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,android/**,ios/**,web/**,linux/**,windows/**,macos/**,build/**

# Code Coverage (LCOV)
sonar.dart.coverage.reportPath=coverage/lcov.info
sonar.coverage.lcov.reportPaths=coverage/lcov.info
