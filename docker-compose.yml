version: "3.8"

services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: liveeuy-auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./auth-service/.env
    environment:
      - PORT=8080
      - RUNNING_IN_DOCKER=true
    volumes:
      - ./auth-service/internal/utils/certs:/app/internal/utils/certs
    networks:
      - liveeuy-network

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: liveeuy-catalog-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./catalog-service/.env
    environment:
      - SERVER_PORT=8081
      - JWK_SET_URI=http://auth-service:8080/.well-known/jwks.json
      - JWT_ISSUER=liveeuy-auth-service
    networks:
      - liveeuy-network

  trending-service:
    build:
      context: ./trending-service
      dockerfile: Dockerfile
    container_name: liveeuy-trending-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./trending-service/.env
    environment:
      - PORT=3000
      - CATALOG_SERVICE_URL=http://catalog-service:8081/api/v1/media/batch
    depends_on:
      - catalog-service
    networks:
      - liveeuy-network

  transcoder-service:
    build:
      context: ./transcoder-service
      dockerfile: Dockerfile
    container_name: liveeuy-transcoder-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - JWK_SET_URI=http://auth-service:8080/.well-known/jwks.json
      - JWT_ISSUER=liveeuy-auth-service
      - CATALOG_SERVICE_URL=http://catalog-service:8081/api/v1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=/app/storage
      - MAX_CONCURRENT_JOBS=2
      - PUBLIC_STREAM_BASE_URL=http://localhost/api/v1/transcoder/stream
    volumes:
      - transcoder_data:/app/storage
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
    networks:
      - liveeuy-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: liveeuy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      trending-service:
        condition: service_started
      transcoder-service:
        condition: service_started
    networks:
      - liveeuy-network

volumes:
  pgdata:
  redisdata:
  auth_certs:
  transcoder_data:

networks:
  liveeuy-network:
    driver: bridge
