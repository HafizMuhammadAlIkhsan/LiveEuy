version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: liveeuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: liveeuy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: liveeuy-auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password123@postgres:5432/authdb?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY_PATH=/app/certs/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/certs/public.pem
      - JWT_KEY_ID=liveeuy-auth-key-1
      - JWT_EXPIRATION_MS=900000
      - RUNNING_IN_DOCKER=true
    volumes:
      - auth_certs:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: liveeuy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - trending-service
    networks:
      - liveeuy-network
      
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: liveeuy-catalog-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./catalog-service/.env
    environment:
      - SERVER_PORT=8081
      - JWK_SET_URI=http://auth-service:8080/.well-known/jwks.json
      - JWT_ISSUER=liveeuy-auth-service
    networks:
      - liveeuy-network

  trending-service:
    build:
      context: ./trending-service
      dockerfile: Dockerfile
    container_name: liveeuy-trending-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./trending-service/.env
    environment:
      - PORT=3000
      - CATALOG_SERVICE_URL=http://catalog-service:8081/api/v1/media/batch
    depends_on:
      - catalog-service
    networks:
      - liveeuy-network

volumes:
  pgdata:
  redisdata:
  auth_certs:

networks:
  liveeuy-network:
    driver: bridge
