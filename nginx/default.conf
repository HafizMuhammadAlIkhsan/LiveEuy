upstream auth-service {
    server auth-service:8080;
}

upstream catalog-service {
    server catalog-service:8081;
}

upstream trending-service {
    server trending-service:3000;
}

server {
    listen 80;
    server_name localhost;

    # Batas ukuran payload request (agar upload thumbnail/poster/banner tidak kena 413)
    client_max_body_size 25M;

    # Buffer proxy untuk respons JSON besar
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Rate Limiting Zones untuk memitigasi brute-force, scraping database & DoS
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Security Headers & Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://i.ytimg.com https://commondatastorage.googleapis.com https://via.placeholder.com; media-src 'self' blob: https://commondatastorage.googleapis.com https://test-streams.mux.dev https://bitdash-a.akamaihd.net https://multiplatform-f.akamaihd.net http://localhost:* https://*.cloudfront.net https://*.cloudflarestream.com; connect-src 'self' http://localhost:* ws://localhost:* https://*.googleapis.com https://test-streams.mux.dev https://commondatastorage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Health check endpoint langsung di nginx
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # Blokir akses ke file konfigurasi dan dotfiles (.env, .git, dll) kecuali .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Blokir file dump database, backup, dan log
    location ~* \.(sql|bak|dump|tar|gz|zip|log|sqlite|db)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Blokir akses publik ke endpoint internal database & actuator sensitif
    location ~* ^/(actuator/|api/v1/actuator/|h2-console|api/v1/h2-console) {
        deny all;
        access_log off;
        return 404;
    }

    # 1. Routing ke Catalog Service (Swagger UI & OpenAPI Docs)
    location ~ ^/api/v1/(swagger-ui|v3/api-docs) {
        proxy_pass         http://catalog-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 2. Routing ke Catalog Service (media, seasons, episodes)
    location /api/v1/media {
        proxy_pass         http://catalog-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /api/v1/seasons {
        proxy_pass         http://catalog-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Alias /api/v1/catalog
    location = /api/v1/catalog {
        return 301 /api/v1/catalog/;
    }

    location /api/v1/catalog/ {
        proxy_pass         http://catalog-service/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 3. Routing ke Trending Service
    location /api/v1/trending {
        proxy_pass         http://trending-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 4. Routing ke Auth Service (/api/v1/auth) dengan rate limiting proteksi brute force
    location /api/v1/auth {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass         http://auth-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 5. Routing Default ke Auth Service (termasuk /.well-known, swagger, dll)
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass         http://auth-service;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
