<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 78" width="100%" height="100%">
  <defs>
    <!-- Telkomsel Red & Maroon Gradient -->
    <linearGradient id="bgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="30%" stop-color="#881337"/>
      <stop offset="65%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#1e0509"/>
    </linearGradient>

    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="gold5G" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- CTA Button Gradient -->
    <linearGradient id="ctaBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="dropShadowRed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="glow5G" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Rounded Background -->
  <rect x="1" y="1" width="864" height="76" rx="10" fill="url(#bgRed)" stroke="#f43f5e" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Background Lighting Accents -->
  <circle cx="160" cy="39" r="70" fill="#e11d48" opacity="0.25"/>
  <ellipse cx="620" cy="39" rx="120" ry="35" fill="#f59e0b" opacity="0.15"/>

  <!-- Left: 5G Speed Emblem & Telkomsel Brand -->
  <g transform="translate(22, 11)" filter="url(#dropShadowRed)">
    <!-- 5G Badge Icon Box -->
    <rect x="0" y="2" width="56" height="52" rx="10" fill="#1c070c" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="28" y="32" font-family="'Arial Black', sans-serif" font-weight="900" font-size="22" fill="url(#gold5G)" text-anchor="middle" filter="url(#glow5G)">
      5G
    </text>
    <text x="28" y="47" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="8.5" fill="#fca5a5" text-anchor="middle" letter-spacing="1">
      SPEED
    </text>
  </g>

  <!-- Brand Title & Category -->
  <g transform="translate(90, 0)" filter="url(#dropShadowRed)">
    <text x="0" y="46" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="30" fill="#ffffff" stroke="#1c070c" stroke-width="1.5" letter-spacing="0.5">
      TELKOMSEL
    </text>
    <rect x="195" y="24" width="88" height="18" rx="5" fill="#dc2626" stroke="#fecdd3" stroke-width="0.8"/>
    <text x="239" y="36.5" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      MAXSTREAM
    </text>
    <text x="0" y="65" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#fecdd3" letter-spacing="0.5">
      Nonton Sinema 4K Tanpa Buffering dengan Kuota Terluas
    </text>
  </g>

  <!-- Right: Promo CTA Pill Button -->
  <g transform="translate(680, 19)" filter="url(#dropShadowRed)">
    <rect x="0" y="0" width="162" height="40" rx="20" fill="url(#ctaBtn)" stroke="#fffbeb" stroke-width="1.2"/>
    <text x="70" y="25" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" fill="#451a03" text-anchor="middle" letter-spacing="0.5">
      KLAIM 5G SEKARANG
    </text>
    <!-- Arrow Icon Circle -->
    <circle cx="142" cy="20" r="12" fill="#78350f"/>
    <path d="M139 15 L145 20 L139 25" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
