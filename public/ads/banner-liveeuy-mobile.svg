<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 78" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f44"/>
      <stop offset="40%" stop-color="#0a3d78"/>
      <stop offset="75%" stop-color="#022a5e"/>
      <stop offset="100%" stop-color="#01142d"/>
    </linearGradient>

    <!-- Metallic Gold 3D Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Red/Orange CTA Gradient -->
    <linearGradient id="redPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Banner Rounded Background: Slim IDLIX 78px height -->
  <rect x="1" y="1" width="864" height="76" rx="10" fill="url(#bgBlue)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Background Lighting Effect -->
  <ellipse cx="200" cy="39" rx="150" ry="38" fill="#0284c7" opacity="0.2"/>
  <circle cx="750" cy="39" r="60" fill="#f59e0b" opacity="0.2"/>

  <!-- Left Side: Golden Title LIVEEUY -->
  <g transform="translate(24, 0)" filter="url(#dropShadowBlue)">
    <!-- Main Gold Brand: LIVEEUY -->
    <text x="0" y="47" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="32" fill="url(#goldText)" stroke="#451a03" stroke-width="1.8" letter-spacing="1" filter="url(#goldGlow)">
      LIVEEUY
    </text>

    <!-- Tag Under Brand -->
    <rect x="2" y="54" width="148" height="16" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8"/>
    <text x="76" y="66" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="8.5" fill="#93c5fd" text-anchor="middle" letter-spacing="1.2">
      ★ APLIKASI STREAMING RESMI ★
    </text>
  </g>

  <!-- Center Catchphrase: Berani Nonton? -->
  <g transform="translate(198, 0)" filter="url(#dropShadowBlue)">
    <text x="0" y="47" font-family="'Comic Sans MS', 'Fredoka One', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" letter-spacing="0.5">
      Berani Nonton?
    </text>
    <text x="4" y="66" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9.5" fill="#94a3b8" letter-spacing="0.8">
      Ribuan Film Bioskop Gratis • Resolusi 4K Dolby Atmos
    </text>
  </g>

  <!-- Right Side Illustration: Smartphone & Popcorn Cinema Graphic -->
  <g transform="translate(660, 10)" filter="url(#dropShadowBlue)">
    <!-- Smartphone Frame -->
    <rect x="0" y="2" width="34" height="54" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="3" y="6" width="28" height="42" rx="3" fill="#0284c7"/>
    <polygon points="12,21 12,33 22,27" fill="#ffffff"/>
    <circle cx="17" cy="4" r="1" fill="#94a3b8"/>

    <!-- Popcorn Cinema Bucket next to phone -->
    <path d="M40 20 L44 56 L68 56 L72 20 Z" fill="#dc2626" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="48" y1="20" x2="50" y2="56" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="56" y1="20" x2="56" y2="56" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="64" y1="20" x2="62" y2="56" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Popcorn Kernels on Top -->
    <circle cx="45" cy="17" r="4.5" fill="#fef08a"/>
    <circle cx="53" cy="15" r="5" fill="#fef9c3"/>
    <circle cx="61" cy="16" r="4.8" fill="#fef08a"/>
    <circle cx="67" cy="18" r="4" fill="#fef9c3"/>
    <circle cx="57" cy="11" r="4.5" fill="#fef08a"/>

    <!-- Mini Download Badge -->
    <rect x="78" y="7" width="90" height="44" rx="8" fill="url(#redPill)" stroke="#ffffff" stroke-width="1"/>
    <text x="123" y="24" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="9.5" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      UNDUH
    </text>
    <text x="123" y="42" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      GRATIS
    </text>
  </g>
</svg>
