<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 78" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgVip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e281e"/>
      <stop offset="35%" stop-color="#1b4332"/>
      <stop offset="70%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#081c15"/>
    </linearGradient>

    <!-- Cyan 3D Text Gradient -->
    <linearGradient id="cyanText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Gold Badge Gradient -->
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Metallic Pill Border -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Banner Rounded Background: Slim IDLIX 78px height -->
  <rect x="1" y="1" width="864" height="76" rx="10" fill="url(#bgVip)" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="90" cy="39" r="60" fill="#10b981" opacity="0.25"/>
  <circle cx="770" cy="39" r="60" fill="#f59e0b" opacity="0.18"/>

  <!-- Left Illustration: Cinematic Reel & VIP Crown Icon (Compact) -->
  <g transform="translate(24, 11)" filter="url(#dropShadow)">
    <!-- Shield / Emblem Base -->
    <path d="M28 2 L52 11 L52 38 C52 49 28 55 28 55 C28 55 4 49 4 38 L4 11 Z" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
    <path d="M28 5 L48 13 L48 36 C48 45 28 51 28 51 C28 51 8 45 8 36 L8 13 Z" fill="#047857" opacity="0.7"/>
    
    <!-- Crown Graphic inside Emblem -->
    <path d="M15 34 L19 20 L28 27 L37 20 L41 34 Z" fill="url(#goldBadge)" stroke="#fef08a" stroke-width="1"/>
    <circle cx="19" cy="18" r="2" fill="#fef08a"/>
    <circle cx="28" cy="25" r="2" fill="#fef08a"/>
    <circle cx="37" cy="18" r="2" fill="#fef08a"/>

    <!-- Sparkle Stars -->
    <path d="M54 10 L56 14 L60 16 L56 18 L54 22 L52 18 L48 16 L52 14 Z" fill="#38bdf8"/>
    <path d="M3 41 L4 43 L6 44 L4 45 L3 47 L2 45 L0 44 L2 43 Z" fill="#fde047"/>
  </g>

  <!-- Middle Typography: MEMBER BARU (Indonesian Cinema Style) -->
  <g filter="url(#dropShadow)">
    <!-- Subtitle / Tagline Above -->
    <text x="100" y="23" font-family="'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="10" fill="#86efac" letter-spacing="2.5">
      ★ SPONSOR RESMI LIVEEUY CINEMA ★
    </text>

    <!-- Main Title: MEMBER BARU -->
    <text x="98" y="53" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="34" fill="url(#cyanText)" stroke="#083344" stroke-width="2" letter-spacing="3" filter="url(#cyanGlow)">
      MEMBER BARU
    </text>

    <!-- Subtitle Below Title -->
    <text x="100" y="68" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9.5" fill="#cbd5e1" letter-spacing="1">
      AKSES SEMUA FILM 4K ULTRA HD &amp; BEBAS IKLAN
    </text>
  </g>

  <!-- Right Pill Badge: LIVEEUY VIP -->
  <g transform="translate(654, 13)" filter="url(#dropShadow)">
    <!-- Outer Metallic Glow Box -->
    <rect x="0" y="3" width="176" height="48" rx="10" fill="url(#goldBadge)" stroke="url(#pillBorder)" stroke-width="1.8"/>
    <rect x="3" y="6" width="170" height="20" rx="6" fill="#78350f" opacity="0.65"/>
    
    <!-- Top Pill Text -->
    <text x="88" y="20" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11.5" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">
      LIVEEUY VIP
    </text>

    <!-- Bottom Promo Text -->
    <text x="88" y="42" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      DISKON 50%
    </text>
  </g>
</svg>
