version: '3.8'

# ==============================================================================
# LiveEuy: Local Backend Infrastructure for Mobile & Frontend Development
# Digunakan untuk menjalankan PostgreSQL, Redis, dan microservices lokal.
# ==============================================================================

services:
  # Isolated Local PostgreSQL Database for Backend Development
  postgres:
    image: postgres:16-alpine
    container_name: liveeuy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: liveeuy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional pgAdmin Web GUI for DB Inspection (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: liveeuy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@liveeuy.id
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  redisdata:
