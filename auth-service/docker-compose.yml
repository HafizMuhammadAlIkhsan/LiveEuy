version: '3.8'

services:
  auth-service:
    build: .
    container_name: liveeuy-auth-service
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - liveeuy-net

  nginx:
    image: nginx:alpine
    container_name: liveeuy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
    networks:
      - liveeuy-net

networks:
  liveeuy-net:
    driver: bridge
