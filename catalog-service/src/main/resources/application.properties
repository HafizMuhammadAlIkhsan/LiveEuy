spring.application.name=catalog-service

server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api/v1

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ----------------------------------------
# KONFIGURASI DATABASE (POSTGRESQL / NEON DB)
# ----------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/liveeuy-catalog-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# JPA & HIBERNATE
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# ----------------------------------------
# PROTEKSI ACTUATOR & DATABASE CONSOLE
# ----------------------------------------
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ----------------------------------------
# KEAMANAN & OAUTH2 RESOURCE SERVER (JWT ASIMETRIS / JWKS)
# ----------------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:liveeuy-auth-service}
app.jwt.issuer=${JWT_ISSUER:liveeuy-auth-service}

# ----------------------------------------
# CLOUDFLARE R2 STORAGE
# ----------------------------------------
# Account ID dari Cloudflare Dashboard → R2 → Overview
r2.account-id=${R2_ACCOUNT_ID:}
# API Token credentials dari Cloudflare Dashboard → R2 → Manage R2 API Tokens
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
# Nama bucket R2 untuk catalog-service
r2.bucket-name=${R2_BUCKET_NAME:liveeuy-catalog}
# Custom domain publik (opsional). Jika diisi, URL file akan memakai domain ini.
# Contoh: https://cdn.liveeuy.com
r2.public-url=${R2_PUBLIC_URL:}
# Durasi presigned URL download dalam menit (default 60 menit)
r2.presign-expiry-minutes=${R2_PRESIGN_EXPIRY_MINUTES:60}

# ----------------------------------------
# MULTIPART UPLOAD CONFIG
# ----------------------------------------
spring.servlet.multipart.enabled=true
# Batas ukuran per file (100MB untuk video trailer)
spring.servlet.multipart.max-file-size=100MB
# Batas ukuran total request
spring.servlet.multipart.max-request-size=110MB
